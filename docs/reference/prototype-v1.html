<title>Haven Campus Prototype</title>

<style>
/* Layout: a phone-sized app centred on a quiet backdrop; on desktop a test-task card sits beside it, on phones the app fills the screen. */
:root {
  --backdrop: #E3EAE8;
  --surface: #F6F8F7;
  --card: #FFFFFF;
  --ink: #1C2B2D;
  --muted: #586A6C;
  --line: #D3DDDA;
  --accent: #2E6A6E;
  --accent-soft: #D6E7E4;
  --accent-ink: #FFFFFF;
  --sos: #B3342B;
  --sos-soft: #F6E0DC;
  --sos-ink: #FFFFFF;
  --ok: #2C7A4C;
  --m1: #7A66A0; --m2: #8F96BC; --m3: #9FB2AD; --m4: #5FA393; --m5: #2C8467;
  --shadow: 0 1px 2px rgba(28,43,45,.06), 0 8px 24px rgba(28,43,45,.08);
  --f-display: "Bricolage Grotesque", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --backdrop: #0B1112; --surface: #121B1C; --card: #1A2526; --ink: #E3ECEA; --muted: #9AACAA; --line: #2B3A3B;
    --accent: #72B8B4; --accent-soft: #1E3A3B; --accent-ink: #0C1A1B; --sos: #EE7166; --sos-soft: #3A1E1B; --sos-ink: #1A0B09; --ok: #6CC08E;
    --m1: #A493C8; --m2: #A6ADD3; --m3: #8FA39E; --m4: #6FBBA9; --m5: #4FB38F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --backdrop: #0B1112; --surface: #121B1C; --card: #1A2526; --ink: #E3ECEA; --muted: #9AACAA; --line: #2B3A3B;
  --accent: #72B8B4; --accent-soft: #1E3A3B; --accent-ink: #0C1A1B; --sos: #EE7166; --sos-soft: #3A1E1B; --sos-ink: #1A0B09; --ok: #6CC08E;
  --m1: #A493C8; --m2: #A6ADD3; --m3: #8FA39E; --m4: #6FBBA9; --m5: #4FB38F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--backdrop); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; padding: 0 16px; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding-block: 32px; min-height: 100%; }
.phone { width: 390px; height: 820px; max-height: calc(100vh - 64px); min-height: 640px; border-radius: 40px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; position: relative; flex: none; }
.panel { width: 320px; flex: none; padding-top: 24px; }
.panel h1 { font-family: var(--f-display); font-size: 28px; line-height: 1.1; margin: 0 0 8px; text-wrap: balance; }
.panel p { color: var(--muted); margin: 0 0 16px; }
.tasks { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 10px; counter-reset: t; }
.tasks li { counter-increment: t; display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tasks li::before { content: "T" counter(t); font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 15px; padding-top: 1px; }
@media (max-width: 760px) {
  body { padding: 0; }
  .stage { padding-block: 0; display: block; }
  .phone { width: 100%; height: 100vh; height: 100dvh; max-height: none; min-height: 0; border-radius: 0; border: 0; box-shadow: none; }
  .panel { display: none; }
}
body.shot { padding: 0; background: var(--surface); }
body.shot .stage { padding-block: 0; display: block; }
body.shot .phone { width: 100%; height: 100vh; max-height: none; min-height: 0; border-radius: 0; border: 0; box-shadow: none; }
body.shot .panel { display: none; }
body.shot * { transition: none !important; animation-duration: 0s !important; }
/* Wireframe look for early-concept figures: greyscale, plain type, no shadows. */
body.wire .phone { filter: grayscale(1) contrast(.92); }
body.wire .proto-note { display: none; }
body.wire { --f-display: Arial, Helvetica, sans-serif; --f-body: Arial, Helvetica, sans-serif; --shadow: none; }

/* App chrome */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; }
.topbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; min-height: 60px; }
.topbar .title { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; margin-left: -10px; }
.iconbtn svg { width: 24px; height: 24px; }
.sosbtn { border: 0; background: var(--sos); color: var(--sos-ink); font-weight: 700; letter-spacing: .06em; border-radius: 999px; height: 40px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; }
.sosbtn svg { width: 16px; height: 16px; }
.host { flex: 1; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.screen.in-r { animation: inR .26s ease-out; }
.screen.in-l { animation: inL .26s ease-out; }
.screen.fade { animation: fade .3s ease-out; }
@keyframes inR { from { transform: translateX(28px); opacity: .0; } to { transform: none; opacity: 1; } }
@keyframes inL { from { transform: translateX(-28px); opacity: .0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .screen.in-r, .screen.in-l, .screen.fade { animation: none; } }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--card); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { border: 0; background: transparent; padding: 8px 4px 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); min-height: 56px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }

/* Type */
h2 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 0; }
.lead { color: var(--muted); margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.small { font-size: 13px; color: var(--muted); }
p { margin: 0; }

/* Components */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.card.soft { background: var(--accent-soft); border-color: transparent; }
.card.alert { background: var(--sos-soft); border-color: transparent; }
.btn { border: 0; border-radius: 12px; min-height: 50px; padding: 0 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.quiet { background: transparent; color: var(--accent); min-height: 44px; }
.btn.danger { background: var(--sos); color: var(--sos-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.stack { display: grid; gap: 10px; }
.spacer { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.listbtn { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.listbtn .chev { color: var(--muted); }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; background: var(--accent-soft); color: var(--accent); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.pill.open { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.pill.closed { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.progress { display: flex; gap: 6px; }
.progress span { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
.progress span.on { background: var(--accent); }
.toggle { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.toggle .txt { flex: 1; min-width: 0; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; border: 0; background: var(--line); flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
textarea { width: 100%; min-height: 96px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; background: var(--card); resize: vertical; }
.segment { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.segment button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-weight: 700; color: var(--muted); }
.segment button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.note { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

/* Mood scale */
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mood { border: 2px solid transparent; background: var(--card); border-radius: 14px; padding: 10px 2px; display: grid; justify-items: center; gap: 6px; font-size: 13px; }
.mood .face { width: 44px; height: 44px; }
.mood[aria-pressed="true"] { border-color: var(--ink); font-weight: 700; }
.energy { display: grid; gap: 8px; }
.energy button { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 12px; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 14px; text-align: left; min-height: 52px; }
.energy button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.bars { display: flex; gap: 3px; }
.bars i { width: 10px; height: 18px; border-radius: 3px; background: var(--line); }
.bars i.on { background: var(--accent); }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; color: var(--muted); }
.week .d { display: grid; justify-items: center; gap: 4px; }
.week .blob { width: 28px; height: 28px; border-radius: 50%; border: 1.5px dashed var(--line); }
.week .today { color: var(--ink); font-weight: 700; }

/* Slots */
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.day { flex: none; width: 62px; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 4px; display: grid; justify-items: center; font-size: 13px; }
.day b { font-size: 18px; font-family: var(--f-display); }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; min-height: 44px; font-variant-numeric: tabular-nums; }
.slot:disabled { text-decoration: line-through; color: var(--muted); background: var(--surface); cursor: not-allowed; }
.slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

/* SOS */
.svc { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.svc .name { font-weight: 700; }
.svc .callbtn { grid-row: span 2; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; min-height: 44px; padding: 0 18px; }
.svc.closed .callbtn { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.hold { position: relative; width: 100%; min-height: 64px; border: 0; border-radius: 16px; background: var(--sos); color: var(--sos-ink); font-weight: 700; font-size: 17px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.hold .fill { position: absolute; inset: 0; background: rgba(255,255,255,.28); transform-origin: left; transform: scaleX(0); }
.hold span { position: relative; }
.call-ring { width: 120px; height: 120px; border-radius: 50%; margin: 12px auto; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.call-ring svg { width: 44px; height: 44px; }
.call-ring.live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--accent) 15%, transparent); } }
.num { font-family: var(--f-display); font-size: 30px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; user-select: all; }

/* Breathe */
.breath { width: 220px; height: 220px; margin: 16px auto; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; transition: transform 4s ease-in-out; }
.breath b { font-family: var(--f-display); font-size: 22px; color: var(--accent); }

/* PIN */
.pindots { display: flex; justify-content: center; gap: 16px; margin: 8px 0; }
.pindots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); }
.pindots i.on { background: var(--ink); }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 24px; justify-content: center; }
.key { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--card); font-size: 26px; font-family: var(--f-display); box-shadow: inset 0 0 0 1px var(--line); }
.key.blank { visibility: hidden; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Sheet + toast */
.scrim { position: absolute; inset: 0; background: rgba(10,20,20,.45); display: flex; align-items: flex-end; z-index: 20; animation: fade .2s; }
.sheet { background: var(--card); width: 100%; border-radius: 22px 22px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 76px; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 12px 16px; z-index: 30; font-weight: 700; animation: fade .2s; }
.sample { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 1px 6px; }
.welcome-art { height: 210px; border-radius: 24px; background: var(--accent-soft); display: grid; place-items: center; }
.welcome-art svg { width: 160px; height: 160px; }
.promise { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.promise .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.promise .ic svg { width: 22px; height: 22px; }
.rolecard { width: 100%; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: var(--r); padding: 16px; display: grid; gap: 4px; }
.rolecard[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; }
.ref { font-family: var(--f-display); font-size: 28px; letter-spacing: .08em; font-weight: 700; }
</style>

  <div class="phone" id="phone"><div class="app" id="app"></div></div>

</div>

    const sos = def.noSos ? "" : `<button class="sosbtn" data-act="sos" aria-label="SOS: ${t("getHelp")}">${I.sos}SOS</button>`;
    top = `<header class="topbar">${left}${sos}</header>`;
  }
  const tabbar = isTab ? `<nav class="tabbar" aria-label="Main">${TABS.map((k) => `<button class="tab" data-act="tab" data-to="${k}" ${k === cur.name ? 'aria-current="page"' : ""}>${I[k]}<span>${t("tab" + k[0].toUpperCase() + k.slice(1))}</span></button>`).join("")}</nav>` : "";
  app.innerHTML = `${top}<main class="host"><section class="screen ${anim || ""}" id="screen">${def.html}</section></main>${tabbar}`;
  document.documentElement.lang = S.lang === "zh" ? "zh-CN" : "en";
  if (def.after) def.after(document.getElementById("screen"));
  renderPanel();
}
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  app.appendChild(el); setTimeout(() => el.remove(), 2200);
}
function sheet(title, body, actions) {
  const scrim = document.createElement("div"); scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p class="lead">${esc(body)}</p>${actions.map((a, i) => `<button class="btn ${a.cls || ""}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div>`;
  scrim.addEventListener("click", (e) => {
    if (e.target === scrim) return scrim.remove();
    const b = e.target.closest("[data-i]"); if (!b) return;
    scrim.remove(); const fn = actions[+b.dataset.i].run; if (fn) fn();
  });
  app.appendChild(scrim); scrim.querySelector("button").focus();
}

          <button class="btn ghost" style="color:var(--sos);border-color:var(--sos)" data-act="deleteCheckins">${t("deleteCheckins")}</button></div></div>
      <div class="stack mobile-only"><span class="eyebrow">${t("protoPanel")}</span>
        <div class="card"><b>${t("testTasks")}</b><ol class="small" style="margin:0;padding-left:20px">${[1,2,3,4,5].map((i) => `<li>${t("task" + i)}</li>`).join("")}</ol>
          <button class="btn quiet" data-act="reset">${t("resetDemo")}</button></div></div>` };
  },
  sos() {
    const svcs = [...SERVICES].sort((a, b) => (b.open() - a.open()));
    return { title: t("sosTitle"), noSos: true, html: `
      <p class="lead">${t("sosLead")}</p>
      <div class="card alert"><b>${t("danger")}</b>
        <button class="btn danger" data-act="call" data-id="999">${I.phone.replace("<svg", '<svg width="20" height="20" style="vertical-align:-4px;margin-right:6px"')}${t("call999")}</button>
        <button class="hold" id="hold" aria-describedby="hold-hint"><span class="fill"></span><span>${t("holdAlert")}</span></button>
        <p class="small" id="hold-hint" style="color:var(--ink)">${t("holdHint")}</p></div>
      ${svcs.filter((s) => s.id !== "999").map((s) => { const open = s.open(); return `<div class="svc ${open ? "" : "closed"}"><div class="name">${t(s.name)}</div><button class="callbtn" data-act="call" data-id="${s.id}" ${open ? "" : 'aria-disabled="true"'}>${t("call")}</button><div class="row" style="flex-wrap:wrap;gap:6px"><span class="pill ${open ? "open" : "closed"}"><span class="dot"></span>${t(open ? "openNow" : "closedNow")}</span><span class="small">${t(s.hours)}</span></div></div>`; }).join("")}
      <details class="card"><summary><b>${t("helpingFriend")}</b></summary><p class="small" style="margin-top:8px">${t("friendTips")}</p></details>`,
      after: bindHold };
  },
  calling(p) {
    const s = SERVICES.find((x) => x.id === p.id);
    return { title: "", noSos: true, html: `
      <div style="text-align:center;display:grid;gap:6px"><span class="eyebrow" id="call-state">${t("calling")}…</span><h2>${t(s.name)}</h2></div>
      <div class="call-ring live">${I.phone}</div>
      <p class="note" style="justify-content:center">${I.info}${t("protoCall")}</p>
      <div class="card" style="text-align:center"><span class="small">${s.number ? t("toCallReal") : t("campusDemo")}</span><div class="num">${s.number || "03-0000 0000"}</div></div>
      <div class="card" style="gap:0">${toggleRow("shareLoc", "shareLoc", null, true)}</div>
      <div class="card soft" style="text-align:center"><p>${t("whileWait")}</p><b id="breath-cue" style="font-family:var(--f-display);font-size:20px;color:var(--accent)">${t("inhale")}</b></div>
      <button class="btn danger" data-act="endCall">${t("endCall")}</button>`,
      after: () => {
        timers.push(setTimeout(() => { const el = document.getElementById("call-state"); if (el) el.textContent = t("connected"); }, 2200));
        cycleCue("breath-cue");
      } };
  },
  alerted() {
    return { title: "", noSos: true, html: `
      <div class="call-ring" style="background:var(--sos-soft);color:var(--sos)">${I.shield}</div>
      <h2 style="text-align:center">${t("alertedTitle")}</h2><p class="lead" style="text-align:center">${t("alertedLead")}</p>
      <p class="note" style="justify-content:center">${I.info}${t("protoAlert")}</p>
      <div class="card soft" style="text-align:center"><p>${t("whileWait")}</p><b id="breath-cue" style="font-family:var(--f-display);font-size:20px;color:var(--accent)">${t("inhale")}</b></div>
      <button class="btn ghost" data-act="sosBack">${t("back")}</button>`,
      after: () => cycleCue("breath-cue") };
  },
  breathe() {
    return { title: t("breatheTitle"), html: `
      <p class="lead" style="text-align:center">${t("breatheLead")}</p>
      <div class="breath" id="breath"><b id="breath-word">${t("inhale")}</b></div>
      <div class="spacer"></div><button class="btn" data-act="back">${t("finish")}</button>`,
      after: () => {
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const phases = [["inhale", 4000, 1.25], ["hold", 4000, 1.25], ["exhale", 6000, 0.85]];
        let i = 0;
        const step = () => {
          const b = document.getElementById("breath"), w = document.getElementById("breath-word"); if (!b) return;
          const [k, ms, sc] = phases[i % 3];
          w.textContent = t(k); b.style.transitionDuration = ms + "ms"; if (!reduce && !SHOT) b.style.transform = `scale(${sc})`;
          i++; timers.push(setTimeout(step, ms));
        };
        step();
      } };
  },
};

// ---------- screen helpers ----------
function progress(n) { return `<div><span class="small">${t("step")} ${n} ${t("of")} 3</span><div class="progress" style="margin-top:6px">${[1,2,3].map((i) => `<span class="${i <= n ? "on" : ""}"></span>`).join("")}</div></div>`; }
function toggleRow(key, label, desc, local) {
  const val = local ? !!draft[key] : !!S[key];
  return `<div class="toggle"><div class="txt"><b id="lbl-${key}">${t(label)}</b>${desc ? `<div class="small">${t(desc)}</div>` : ""}</div><button class="switch" role="switch" aria-checked="${val}" aria-labelledby="lbl-${key}" data-act="toggle" data-k="${key}" ${local ? 'data-local="1"' : ""}></button></div>`;
}
function pinPad(msg) {
  return `<div class="pindots" aria-live="polite">${[0,1,2,3].map(() => "<i></i>").join("")}</div>
    ${msg ? `<p class="small" style="text-align:center;color:var(--sos)" role="alert">${esc(msg)}</p>` : ""}
    <div class="keypad">${["1","2","3","4","5","6","7","8","9","","0","⌫"].map((k) => `<button class="key ${k === "" ? "blank" : ""}" data-key="${k}" ${k === "⌫" ? 'aria-label="Delete"' : ""} ${k === "" ? 'tabindex="-1" aria-hidden="true"' : ""}>${k}</button>`).join("")}</div>`;
}
function bindPin(el, done) {
  let code = "";
  const dots = el.querySelectorAll(".pindots i");
  const paint = () => dots.forEach((d, i) => d.classList.toggle("on", i < code.length));
  el.querySelector(".keypad").addEventListener("click", (e) => {
    const k = e.target.closest("[data-key]"); if (!k || !k.dataset.key) return;
    if (k.dataset.key === "⌫") code = code.slice(0, -1); else if (code.length < 4) code += k.dataset.key;
    paint(); if (code.length === 4) setTimeout(() => done(code), 150);
  });
}
function cycleCue(id) {
  const phases = [["inhale", 4000], ["hold", 4000], ["exhale", 6000]]; let i = 0;
  const step = () => { const el = document.getElementById(id); if (!el) return; el.textContent = t(phases[i % 3][0]); timers.push(setTimeout(step, phases[i % 3][1])); i++; };
  step();
}
function bindHold(el) {
  const btn = el.querySelector("#hold"); if (!btn) return;
  const fill = btn.querySelector(".fill"); let start = 0, raf = 0;
  const DUR = 2000;
  const tick = (now) => { const p = Math.min(1, (now - start) / DUR); fill.style.transform = `scaleX(${p})`; if (p >= 1) { stop(); go("alerted"); } else raf = requestAnimationFrame(tick); };
  const begin = (e) => { if (e.type === "keydown" && e.key !== " " && e.key !== "Enter") return; if (e.type === "keydown") { if (e.repeat) return; e.preventDefault(); } if (start) return; start = performance.now(); raf = requestAnimationFrame(tick); };
  const stop = () => { cancelAnimationFrame(raf); start = 0; fill.style.transform = "scaleX(0)"; };
  btn.addEventListener("pointerdown", begin); btn.addEventListener("keydown", begin);
  ["pointerup", "pointerleave", "pointercancel", "keyup", "blur"].forEach((ev) => btn.addEventListener(ev, stop));
  btn.addEventListener("click", (e) => e.preventDefault());
}
function finishOnboarding() { S.onboarded = true; save(); go("home", {}, { root: true }); }

// ---------- actions ----------
const A = {
  back, to: (d) => go(d.to),
  tab: (d) => go(d.to, {}, { root: true }),
  sos: () => { if (current().name !== "sos") go("sos"); },
  sosBack: () => back(),
  lang: (d) => { S.lang = d.l; save(); render("fade"); },
  role: (d) => { S.role = d.r; save(); render(); },
  roleSwitch: (d) => { S.role = d.r; save(); render(); },
  finishOnboarding,
  startCheckin: () => { const te = todayEntry(); draft = te ? { mood: te.mood, energy: te.energy, tags: [...te.tags], note: te.note } : { tags: [] }; go("ciMood"); },
  setMood: (d) => { draft.mood = +d.v; render(); },
  setEnergy: (d) => { draft.energy = +d.v; render(); },
  tag: (d) => { draft.note = (document.getElementById("ci-note") || {}).value || draft.note; const tg = draft.tags || (draft.tags = []); const i = tg.indexOf(d.k); i >= 0 ? tg.splice(i, 1) : tg.push(d.k); render(); },
  saveCheckin: () => {
    draft.note = document.getElementById("ci-note").value;
    S.checkins = S.checkins.filter((c) => c.d !== iso(TODAY));
    S.checkins.push({ d: iso(TODAY), mood: draft.mood, energy: draft.energy, tags: draft.tags || [], note: draft.note || "", sample: false });
    save(); draft = {}; go("ciDone", {}, { replace: true });
  },
  filter: (d) => { S.filters[d.f] = d.v || null; save(); render(); },
  counsellor: (d) => { if (!draft.replaceId) draft = {}; go("counsellor", { id: d.id }); },
  setMode: (d) => { draft.mode = d.v; render(); },
  setDay: (d) => { draft.day = d.v; draft.time = null; render(); },
  setTime: (d) => { draft.time = d.v; render(); },
  toggle: (d) => {
    if (d.local) { draft[d.k] = !draft[d.k]; render(); return; }
    if (d.k === "lockOn" && !S.pin) { go("setpin", {}); return; }
    S[d.k] = !S[d.k]; save(); render();
  },
  confirmBooking: () => {
    draft.note = document.getElementById("bk-note").value;
    const id = "s" + Date.now();
    const ref = S.useRef ? "HV-" + String(1000 + Math.floor(Math.random() * 9000)) : null;
    if (draft.replaceId) S.sessions = S.sessions.filter((s) => s.id !== draft.replaceId);
    S.sessions.push({ id, cid: draft.cid, day: draft.day, time: draft.time, mode: draft.mode, ref });
    S.sessions.sort((a, b) => (a.day + a.time).localeCompare(b.day + b.time));
    save(); draft = {}; stack = [{ name: "home", params: {} }]; go("booked", { id });
  },
  session: (d) => go("session", { id: d.id }),
  reschedule: (d) => { const s = S.sessions.find((x) => x.id === d.id); draft = { cid: s.cid, mode: s.mode, replaceId: s.id }; go("counsellor", { id: s.cid }); },
  cancelSession: (d) => sheet(t("cancelQ"), t("cancelD"), [
    { label: t("yesCancel"), cls: "danger", run: () => { S.sessions = S.sessions.filter((s) => s.id !== d.id); save(); go("me", {}, { root: true }); toast(t("cancelled")); } },
    { label: t("noKeep"), cls: "quiet" }]),
  deleteCheckins: () => sheet(t("deleteQ"), t("deleteD"), [
    { label: t("delete"), cls: "danger", run: () => { S.checkins = []; save(); render(); toast(t("deleted")); } },
    { label: t("cancel"), cls: "quiet" }]),
  lockNow: () => { S.locked = true; save(); go("lock", {}, { root: true }); },
  call: (d) => { const s = SERVICES.find((x) => x.id === d.id); if (!s.open()) { toast(t("closedToast")); return; } go("calling", { id: d.id }); },
  endCall: () => back(),
  reset: () => resetAll(),
};
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset);
});
app.addEventListener("input", (e) => { if (e.target.id === "ci-note" || e.target.id === "bk-note") draft.note = e.target.value; });

function resetAll() {
  try { localStorage.removeItem(KEY); } catch (e) {}
  S = freshState(); draft = {}; go("welcome", {}, { root: true }); toast(t("resetDone"));
}

// ---------- desktop task panel ----------
const panel = document.getElementById("panel");
function renderPanel() {
  panel.innerHTML = `<h1>${t("panelTitle")}</h1><p>${t("panelLead")}</p>
    <ol class="tasks">${[1,2,3,4,5].map((i) => `<li><span>${t("task" + i)}</span></li>`).join("")}</ol>
    <button class="btn ghost" id="panel-reset">${t("resetDemo")}</button>`;
  panel.querySelector("#panel-reset").onclick = resetAll;
  document.querySelectorAll(".mobile-only").forEach((el) => { el.hidden = matchMedia("(min-width: 761px)").matches && !SHOT; });
}

// ---------- screenshot presets (local use: #shot-name) ----------
function shotSetup(name) {
  document.body.classList.add("shot");
  S.onboarded = true; S.role = "student";
  if (name.endsWith("-wf")) { document.body.classList.add("wire"); name = name.slice(0, -3); }
  const zh = name.endsWith("-zh"); if (zh) { S.lang = "zh"; name = name.slice(0, -3); }
  const withSession = () => { S.sessions = [{ id: "s1", cid: "c4", day: weekdaysAhead(2)[1], time: "14:00", mode: "video", ref: "HV-4827" }]; };
  const map = {
    welcome: () => { S.onboarded = false; S.role = null; go("welcome", {}, { root: true }); },
    privacy: () => { stack = [{ name: "welcome" }]; go("privacy"); },
    role: () => { stack = [{ name: "privacy" }]; go("role"); },
    setpin: () => { stack = [{ name: "role" }]; go("setpin"); },
    home: () => { withSession(); go("home", {}, { root: true }); },
    "ci-mood": () => { stack = [{ name: "home" }]; draft = { mood: 2, tags: [] }; go("ciMood"); },
    "ci-energy": () => { stack = [{ name: "home" }]; draft = { mood: 2, energy: 2, tags: [] }; go("ciEnergy"); },
    "ci-tags": () => { stack = [{ name: "home" }]; draft = { mood: 2, energy: 2, tags: ["tExams", "tSleep"], note: "" }; go("ciTags"); },
    "ci-done": () => { S.checkins.push({ d: iso(TODAY), mood: 2, energy: 2, tags: ["tExams"], note: "", sample: false }); stack = [{ name: "home" }]; go("ciDone"); },
    mood: () => { S.checkins.push({ d: iso(TODAY), mood: 2, energy: 2, tags: ["tExams"], note: "", sample: false }); go("mood", {}, { root: true }); },
    book: () => { S.filters = { lang: "zh", mode: null }; go("book", {}, { root: true }); },
    counsellor: () => { stack = [{ name: "book" }]; draft = { cid: "c4", mode: "video", day: weekdaysAhead(5)[1], time: "14:00" }; go("counsellor", { id: "c4" }); },
    confirm: () => { stack = [{ name: "book" }, { name: "counsellor", params: { id: "c4" } }]; draft = { cid: "c4", mode: "video", day: weekdaysAhead(5)[1], time: "14:00" }; go("confirm"); },
    booked: () => { withSession(); stack = [{ name: "home" }]; go("booked", { id: "s1" }); },
    session: () => { withSession(); stack = [{ name: "me" }]; go("session", { id: "s1" }); },
    me: () => { withSession(); go("me", {}, { root: true }); },
    sos: () => { stack = [{ name: "home" }]; go("sos"); },
    calling: () => { stack = [{ name: "home" }, { name: "sos" }]; go("calling", { id: "bef" }); },
    alerted: () => { stack = [{ name: "home" }, { name: "sos" }]; go("alerted"); },
    lock: () => { S.pin = "1234"; S.lockOn = true; go("lock", {}, { root: true }); },
    breathe: () => { stack = [{ name: "home" }]; go("breathe"); },
  };
  (map[name] || map.home)();
}

// ---------- boot ----------
if (SHOT) shotSetup(location.hash.slice(6));
else if (!S.onboarded) go("welcome", {}, { root: true });
else if (S.lockOn && S.pin) go("lock", {}, { root: true });
else go("home", {}, { root: true });
})();
</script>
